---
# tasks file for elasticsearch
- name: Add repository for elasticsearch
  block:
    - name: Add gpg key for repository
      ansible.builtin.get_url:
        url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        dest: /etc/apt/keyrings/deb.elasticsearch.gpg
    - name: Add elasticsearch repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/deb.elasticsearch.gpg] https://artifacts.elastic.co/packages/9.x/apt stable main"
        state: present
  become: true

- name: Install elasticsearch
  ansible.builtin.package:
    name:
      - apt-transport-https
      - elasticsearch
    state: present
  become: true

- name: Ensure elasticsearch service is enabled and started
  become: true
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: true
  vars:
    ansible_systemd_baggage_limit: 180
  async: 180
  poll: 15

- name: Manage elasticsearch credentials
  become: true
  block:
  - name: Generate new elastic user password
    ansible.builtin.command:
      cmd: /usr/share/elasticsearch/bin/elasticsearch-reset-password -u elastic -b -s
    register: reset_password_output
    changed_when: true

  - name: Extract password from CLI output
    ansible.builtin.set_fact:
      generated_elastic_pw: "{{ reset_password_output.stdout | trim }}"

  - name: Read HTTP certificate
    ansible.builtin.slurp:
      src: /etc/elasticsearch/certs/http_ca.crt
    register: elastic_cert_raw

  - name: Save certificate to host
    ansible.builtin.set_fact:
      elastic_cert_content: "{{ elastic_cert_raw.content | b64decode }}"
    delegate_to: localhost
    delegate_facts: true
