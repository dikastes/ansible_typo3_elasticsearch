---
# tasks file for webtasksmain
#
- name: Add repository for PHP
  block:
    - name: Add gpg key for php repository
      ansible.builtin.get_url:
        url: https://packages.sury.org/php/apt.gpg
        dest: /etc/apt/keyrings/deb.sury.org-php.gpg

    - name: Add php repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/deb.sury.org-php.gpg] https://packages.sury.org/php/ {{ ansible_distribution_release }} main"
        state: present
  become: true

- name: Install PHP
  ansible.builtin.package:
    name:
      - php{{ php_version }}-fpm
      - php{{ php_version }}-cli
      - php{{ php_version }}-mysqlnd
      - php{{ php_version }}-gd
      - php{{ php_version }}-curl
      - php{{ php_version }}-ldap
      - php{{ php_version }}-mbstring
      - php{{ php_version }}-intl
      - php{{ php_version }}-xsl
      - php{{ php_version }}-opcache
      - php{{ php_version }}-pgsql
      - php{{ php_version }}-zip
      - php{{ php_version }}-xml
      - php{{ php_version }}-soap
      - php{{ php_version }}-apcu
      - php{{ php_version }}-redis
      - php{{ php_version }}-gmagick
    state: present
  notify: restart php
  become: true

- name: Enable Apcu for PHP-CLI (used by TYPO3 cli)
  lineinfile:
    dest: "/etc/php/{{ php_version }}/cli/conf.d/20-apcu.ini"
    regexp: "^apc.enable_cli"
    line: "apc.enable_cli=on"
    state: present
  become: true

- name: Install required packages
  ansible.builtin.package:
    name:
      - apache2
      - libapache2-mod-php{{ php_version }}
      - mariadb-server-10.5
      - mariadb-client
      - python3-pymysql
      - unzip
      - git
      - tree

      - curl
      - nodejs
      - npm
    state: present
  become: true

- name: Install Composer
  block:
    - name: Download Composer installer script
      get_url:
        url: https://getcomposer.org/installer
        dest: /tmp/composer-setup.php

    - name: Install Composer
      command: >
        php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer --2 --ignore-platform-reqs
      args:
        creates: /usr/local/bin/composer
  become: true

- name: ensure webroot exists
  become: true
  ansible.builtin.file:
    path: /var/www/webroot
    state: directory
    mode: '0755'
    owner: www-data
    group: www-data

- name: write elasticsearch password
  become: true
  ansible.builtin.copy:
    content: "{{ hostvars[target_es_host]['generated_elastic_pw'] }}"
    dest: /var/www/webroot/elastic_pwd.txt
    owner: www-data
    mode: '0440'

- name: Create database
  become: true
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    encoding: UTF8
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present

- name: Create user with database access
  become: true
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_pass }}"
    priv:
      '{{ db_name }}.*:ALL,GRANT'
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present

- name: Configure apache2
  become: true
  block:
    - name: Enable needed modules
      community.general.apache2_module:
        name: "{{ item }}"
        state: present
      with_items:
        - ssl
        - md
        - rewrite
        - alias
        - access_compat
        - auth_basic
        - authn_core
        - authn_file
        - authz_core
        - authz_groupfile
        - authz_host
        - authz_user
        - autoindex
        - deflate
        - dir
        - env
        - expires
        - filter
        - headers
        - http2
        - mime
        - negotiation
        - remoteip
        - setenvif
        - socache_shmcb
        - status
        - proxy
        - proxy_http
        - proxy_fcgi
      notify: restart apache2

- name: Ensure certbot is installed
  become: true
  ansible.builtin.package:
    name: certbot
    state: present

# this only makes sense after dns entry is created
#- name: Run certbot
  #ansible.builtin.command:
    #cmd: certbot certonly -m {{ mail }} --server https://acme.slub-dresden.de --webroot -w /var/www -d {{ url }}

# this stuff is inspired by the slub greenbone scanner
- name: Ensure nftables is installed
  become: true
  ansible.builtin.package:
    name: nftables
    state: present

- name: Deploy nftables configuration
  become: true
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0755'
  notify: Reload nftables

- name: Ensure nftables service is enabled and started
  become: true
  ansible.builtin.systemd:
    name: nftables
    state: started
    enabled: true
  vars:
    ansible_systemd_baggage_limit: 180
  async: 180
  poll: 15

- name: Remove rpcbind package
  become: true
  ansible.builtin.package:
    name: rpcbind
    state: absent
